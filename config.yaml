game: warhammer_3

paths:
  game_dir: "C:/Program Files (x86)/Steam/steamapps/common/Total War WARHAMMER III"
  raw_dir: "./raw"
  db_path: "./twwiki.duckdb"
  site_dir: "./site"
  model_dir: "./model"

server:
  url: "ws://127.0.0.1:45127/ws"
  timeout_s: 120

# No pack list: extract.py reads RPFM's dependency cache for `game`, which
# already resolves the game's packs into one file set. Regenerate the cache in
# RPFM (Game Selected -> Generate Dependencies Cache) after every patch.

# DB table names as RPFM spells them (e.g. main_units_tables).
# Empty list = extract every db table found. Populate to narrow scope.
tables: []

# Tables that are huge and rarely useful in a wiki. Skipped unless in `tables`.
skip_tables:
  - anim_*
  - "*_animations_tables"

# Game images exported to raw/<build_id>/images/<in-game path>.
# `folders`: each entry is a folder (exported whole) or a pattern whose `*`
# matches one path segment (exported file by file).
# `path_columns`: table.column pairs whose values are exact image paths; those
# files are exported too, wherever they live. This is how narrow patterns stay
# safe: text icons (ui_tagged_images) and item icons (ancillary_types) point
# into skin subfolders the patterns leave out.
#
# The build id is derived from the packs the `folders` entries' files come
# from, NOT from this section (files named by path_columns do not feed it; the
# raw manifest lists any pack they come from outside it). Adding, removing or
# narrowing an entry whose files sit in an already-covered pack (almost any
# ui/... folder) leaves the build id unchanged, so extract.py will think the
# build is already extracted and skip it. After changing this section for a
# game build you have already extracted, move or rename the existing
# raw/<build_id>/ directory (raw builds are never deleted by the pipeline) and
# run extract again.
images:
  folders:
    - "ui/battle ui/ability_icons"
    - "ui/campaign ui/technologies"
    - "ui/campaign ui/skills"
    - "ui/campaign ui/effect_bundles"
    - "ui/campaign ui/ancillaries"
    - "ui/campaign ui/mounts"
    - "ui/campaign ui/climate_types"
    - "ui/units/icons"
    - "ui/buildings/icons"
    - "ui/portraits/portholes"
    # Faction flags (mon_64) and small flags used as text icons (mon_24): about
    # 5 MB, against 183 MB for the whole ui/flags folder.
    - "ui/flags/*/mon_64.png"
    - "ui/flags/*/mon_24.png"
    - "ui/frontend ui/faction_bullets"
    - "ui/common ui/unit_category_icons"
    - "ui/cheat_sheet"
    # Text icons named without a folder resolve here (about 76 MB, against
    # 439 MB for all of ui/skins).
    - "ui/skins/default/*.png"
  path_columns:
    - "ui_tagged_images.image_path"
    - "ancillary_types.ui_icon"

# Page queries run against twwiki.duckdb. Tables drop the `_tables` suffix;
# `_columns` lists every column with its key and reference flags.
pages:
  units:
    query: |
      SELECT
        mu.unit                                   AS key,
        resolve_loc('land_units_onscreen_name_' || lu.key) AS name,
        mu.caste,
        lu.category,
        lu.class,
        mu.num_men,
        mu.recruitment_cost,
        mu.upkeep_cost,
        lu.melee_attack,
        lu.melee_defence,
        lu.charge_bonus,
        lu.bonus_hit_points,
        lu.morale
      FROM main_units mu
      LEFT JOIN land_units lu ON lu.key = mu.land_unit
      ORDER BY name
    template: entity.md.j2
    slug: key

  # Building names live on culture variants, keyed by
  # building || culture || subculture || faction with no separators. A few
  # levels are named differently per culture; the generic variant wins, then
  # the first by culture.
  buildings:
    query: |
      SELECT
        bl.level_name                             AS key,
        coalesce((
          SELECT nullif(l.text, '')
          FROM building_culture_variants bcv
          JOIN loc l ON l.key = 'building_culture_variants_name_'
                            || bcv.building || bcv.culture || bcv.subculture || bcv.faction
          WHERE bcv.building = bl.level_name AND l.text <> ''
          ORDER BY (bcv.culture || bcv.subculture || bcv.faction) <> '',
                   bcv.culture, bcv.subculture, bcv.faction
          LIMIT 1
        ), bl.level_name)                         AS name,
        bl.chain,
        bl.level,
        bl.create_time,
        bl.create_cost,
        bl.upkeep_cost,
        (SELECT string_agg(DISTINCT bcv.culture, ', ' ORDER BY bcv.culture)
         FROM building_culture_variants bcv
         WHERE bcv.building = bl.level_name AND bcv.culture <> '') AS cultures
      FROM building_levels bl
      ORDER BY name
    template: entity.md.j2
    slug: key
