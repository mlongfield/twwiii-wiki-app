[project]
name = "twwiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "duckdb>=1.0",
    "pyyaml>=6",
    "pandas>=2",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
